<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#fbfaf7"/>
  <style>
    .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #202124; }
    .label { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #202124; }
    .small { font: 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #4b4d50; }
    .tiny { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4b4d50; }
    .box { stroke: #303236; stroke-width: 2; rx: 12; }
    .arrow { stroke: #55585d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 8 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#55585d"/>
    </marker>
  </defs>

  <text x="60" y="58" class="title">Virtual machine architecture</text>
  <text x="60" y="84" class="small">A stack-based interpreter for compiled bytecode</text>

  <!-- Program memory -->
  <rect x="60" y="125" width="360" height="220" class="box" fill="#e8f0fb"/>
  <text x="84" y="160" class="label">BytecodeProgram</text>
  <rect x="84" y="180" width="312" height="66" class="box" fill="#fff"/>
  <text x="102" y="207" class="small">instruction array</text>
  <text x="102" y="229" class="tiny">code: Instruction[]</text>
  <rect x="84" y="260" width="148" height="60" class="box" fill="#fff"/>
  <text x="101" y="286" class="small">functions[]</text>
  <text x="101" y="306" class="tiny">entry_ip, locals</text>
  <rect x="248" y="260" width="148" height="60" class="box" fill="#fff"/>
  <text x="265" y="286" class="small">global metadata</text>
  <text x="265" y="306" class="tiny">counts, mappings</text>

  <!-- VM control -->
  <rect x="470" y="125" width="300" height="220" class="box" fill="#f1eadb"/>
  <text x="495" y="160" class="label">VM control</text>
  <rect x="495" y="183" width="250" height="58" class="box" fill="#fff"/>
  <text x="515" y="208" class="small">instruction pointer</text>
  <text x="515" y="229" class="tiny">ip → program.code[ip]</text>
  <rect x="495" y="255" width="250" height="58" class="box" fill="#fff"/>
  <text x="515" y="280" class="small">execute_instruction()</text>
  <text x="515" y="301" class="tiny">dispatch by OpCode</text>

  <!-- Runtime state -->
  <rect x="60" y="425" width="320" height="250" class="box" fill="#e8f5ed"/>
  <text x="84" y="460" class="label">Operand / work stack</text>
  <text x="84" y="484" class="small">temporary Values used by opcodes</text>
  <rect x="112" y="510" width="210" height="130" class="box" fill="#fff"/>
  <path d="M112 545 H322 M112 580 H322 M112 615 H322" stroke="#a8b9ad" stroke-width="2"/>
  <text x="132" y="535" class="tiny">Value</text>
  <text x="132" y="570" class="tiny">Int / Bool</text>
  <text x="132" y="605" class="tiny">Object(id)</text>
  <text x="132" y="635" class="tiny">Function / Null</text>

  <rect x="430" y="425" width="320" height="250" class="box" fill="#f7e8e5"/>
  <text x="454" y="460" class="label">CallStack</text>
  <text x="454" y="484" class="small">nested CallFrames</text>
  <rect x="482" y="510" width="215" height="130" class="box" fill="#fff"/>
  <rect x="482" y="510" width="215" height="36" fill="#f4c9c2"/>
  <text x="500" y="534" class="tiny">CallFrame: return_address</text>
  <path d="M482 575 H697" stroke="#d0aaa4" stroke-width="2"/>
  <text x="500" y="568" class="tiny">locals[]</text>
  <text x="500" y="603" class="tiny">CallFrame: return_address</text>
  <text x="500" y="628" class="tiny">locals[]</text>

  <rect x="800" y="425" width="340" height="250" class="box" fill="#eee8f8"/>
  <text x="824" y="460" class="label">Heap</text>
  <text x="824" y="484" class="small">objects referenced by Value.objectId</text>
  <rect x="824" y="510" width="292" height="54" class="box" fill="#fff"/>
  <text x="844" y="534" class="small">ArrayObject</text>
  <text x="844" y="553" class="tiny">elements: Value[]</text>
  <rect x="824" y="580" width="292" height="54" class="box" fill="#fff"/>
  <text x="844" y="604" class="small">StringObject</text>
  <text x="844" y="623" class="tiny">value: string</text>

  <!-- arrows -->
  <path d="M420 235 H470" class="arrow"/>
  <path d="M620 345 V405" class="arrow"/>
  <path d="M470 285 H400 V425" class="arrow"/>
  <path d="M620 345 V385 H910 V425" class="arrow dashed"/>
  <path d="M380 540 H430" class="arrow"/>
  <path d="M750 540 H800" class="arrow"/>
  <path d="M380 585 H430" class="arrow dashed"/>
  <path d="M750 585 H800" class="arrow dashed"/>

  <text x="426" y="226" class="tiny">fetch</text>
  <text x="630" y="378" class="tiny">dispatch / mutate</text>
  <text x="390" y="530" class="tiny">load/store</text>
  <text x="756" y="530" class="tiny">object refs</text>
  <text x="615" y="405" class="tiny">calls + returns</text>

  <text x="60" y="718" class="small">Execution loop: fetch instruction → dispatch opcode → read/write stack, frames, and heap → advance ip.</text>
</svg>
